# Dependabot version updates. PRs are verified by ci.yml and then
# approved/merged by dependabot-auto-merge.yml.
#
# Fleet pin bumping (pin-bump / deps-bump) only rewrites [tool.uv.sources]
# git pins; Dependabot covers action SHAs, the uv lockfile, the Dockerfile
# base-image digest and pre-commit hook revs.
version: 2
updates:
  # GitHub Actions SHAs pinned in workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-all:
        patterns: ["*"]

  # Python dependencies (uv lockfile).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  # Base-image digests in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Hook revs in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
