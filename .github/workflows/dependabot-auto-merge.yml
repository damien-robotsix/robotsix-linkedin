name: Dependabot auto-merge

on:
  pull_request:

permissions: {}  # no workflow-level default; the job grants its own

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Dependabot dependency bumps only.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write  # approve and merge the PR
      pull-requests: write  # label and merge the PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependabot-auto-merge.yml@05d872b062890597dfcdd83d0eeac8918edc3618  # v1.3.0
