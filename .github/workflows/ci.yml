name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# GITHUB_TOKEN permission model (least privilege):
# - Default: the workflow-level block below grants only `contents: read`, so
#   any job without its own `permissions:` block cannot write anything.
# - Every job still declares its own `permissions:` block (AGENT.md CI
#   conventions) instead of relying on the default:
#   - lint-and-test: `contents: read` only (checkout, lint, type check, test).
#   - modules: `contents: read` only (robotsix-modules taxonomy checks).
#   - build (reusable docker-pr-scan.yml, pull requests only): `contents: read`
#     + `security-events: write` to upload the Trivy SARIF; never pushes.
#   - publish (reusable docker-release.yml, `push` events only — main / v*
#     tags): `contents: read` + `packages: write` (push to ghcr.io),
#     `id-token: write` + `attestations: write` (provenance/SBOM
#     attestations) and `security-events: write` (Trivy SARIF upload).
#   - lint-dockerfile (reusable lint-dockerfile.yml): `contents: read` only
#     (hadolint).
#   - lint-workflows: `contents: read` only (actionlint / zizmor).
# - Grant a write scope only on the job that needs it, with an inline comment
#   naming the reason.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repository; no write scopes needed
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install robotsix-config from GitHub
        run: pip install "robotsix-config @ git+https://github.com/damien-robotsix/robotsix-config@b68476fa9aab58f70697d870da956220ecf9cf48"

      # Installed BEFORE robotsix-llmio: robotsix-http is a git-only dependency
      # (not published on PyPI), and robotsix-llmio declares a plain
      # `robotsix-http` requirement in its wheel metadata. Installing it first
      # satisfies that transitive requirement so pip does not try (and fail) to
      # resolve robotsix-http from PyPI while installing robotsix-llmio.
      # The 952d984b rev contains robotsix_http.oauth.SecureTokenStore, which
      # linkedin_service.auth consumes; it is additive over llmio's older
      # v0.6.0 pin (4bf6c1e3) so it satisfies llmio's constraint.
      - name: Install robotsix-http from GitHub
        run: pip install "robotsix-http[fastapi] @ git+https://github.com/damien-robotsix/robotsix-http@952d984b1d228efcc880bca9f7d6b00e14eb3eed"

      - name: Install robotsix-llmio from GitHub
        run: pip install "robotsix-llmio @ git+https://github.com/damien-robotsix/robotsix-llmio@e31d639b9a392c70516a74d81efbaf5b02e1b04b"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test
        run: pytest -v

  modules:
    name: Module taxonomy
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repository; no write scopes needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Validate module taxonomy schema
        run: uv run --frozen robotsix-modules validate docs/modules.yaml

      - name: Check every tracked file is registered to a module
        run: uv run --frozen robotsix-modules check-registration docs/modules.yaml --root .

      - name: Validate module paths
        run: uv run --frozen robotsix-modules validate-paths docs/modules.yaml --root .

  # PR-time image build + Trivy gate (CRITICAL/HIGH) via the shared reusable
  # workflow; the image is built with push: false and never published.
  build:
    name: Build and scan Docker image
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@05d872b062890597dfcdd83d0eeac8918edc3618  # v1.3.0
    permissions:
      contents: read  # checkout the repository
      security-events: write  # upload the Trivy SARIF report to Code Scanning

  # Push-time publish via the shared reusable workflow: builds, pushes to
  # ghcr.io/damien-robotsix/robotsix-linkedin (tags: branch, semver, sha —
  # deploy/docker-compose.yml pulls the `main` branch tag), Trivy-scans with a
  # SARIF upload, and attaches provenance/SBOM attestations.
  publish:
    name: Publish Docker image
    needs: lint-and-test
    if: github.event_name == 'push'
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@05d872b062890597dfcdd83d0eeac8918edc3618  # v1.3.0
    permissions:
      contents: read  # checkout the repository
      packages: write  # push the image to ghcr.io
      id-token: write  # OIDC token for signing build attestations
      attestations: write  # attach provenance/SBOM attestations to the image
      security-events: write  # upload the Trivy SARIF report to Code Scanning

  # Shared hadolint gate for the Dockerfile the build/publish jobs consume.
  lint-dockerfile:
    name: Lint Dockerfile
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@47523e8aa2d34d41da060d29b57f75ab262cb840  # v1.4.0
    with:
      dockerfiles: Dockerfile
      failure-threshold: warning
    permissions:
      contents: read  # checkout the repository; no write scopes needed

  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@6c5841305cc9bdd04f13deb2f05462d041e877be  # v1.2.0
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
