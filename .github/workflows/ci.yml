name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout the repository; no write scopes needed
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install robotsix-config from GitHub
        run: pip install "robotsix-config @ git+https://github.com/damien-robotsix/robotsix-config@b68476fa9aab58f70697d870da956220ecf9cf48"

      # Installed BEFORE robotsix-llmio: robotsix-http is a git-only dependency
      # (not published on PyPI), and robotsix-llmio declares a plain
      # `robotsix-http` requirement in its wheel metadata. Installing it first
      # satisfies that transitive requirement so pip does not try (and fail) to
      # resolve robotsix-http from PyPI while installing robotsix-llmio.
      # The 952d984b rev contains robotsix_http.oauth.SecureTokenStore, which
      # linkedin_service.auth consumes; it is additive over llmio's older
      # v0.6.0 pin (4bf6c1e3) so it satisfies llmio's constraint.
      - name: Install robotsix-http from GitHub
        run: pip install "robotsix-http[fastapi] @ git+https://github.com/damien-robotsix/robotsix-http@952d984b1d228efcc880bca9f7d6b00e14eb3eed"

      - name: Install robotsix-llmio from GitHub
        run: pip install "robotsix-llmio @ git+https://github.com/damien-robotsix/robotsix-llmio@e31d639b9a392c70516a74d81efbaf5b02e1b04b"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Test
        run: pytest -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read  # checkout the repository; image is built locally, not pushed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "robotsix-linkedin:${IMAGE_TAG}" .

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read  # checkout the repository
      packages: write  # push the image to ghcr.io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ghcr.io/damien-robotsix/robotsix-linkedin
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  lint-workflows:
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@c8c2ac9b1dcf02802770818672935ed533bae503  # v1.0.7
    with:
      run-actionlint: true
      run-zizmor: true
    permissions:
      contents: read
