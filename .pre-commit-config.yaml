repos:
  - repo: https://github.com/damien-robotsix/robotsix-modules
    rev: fae8e6f081a5d69c954f67449f0ec16ff8a24c14  # v0.5.4
    hooks:
      - id: validate-module-taxonomy
        files: ^docs/modules\.yaml$
        args: [docs/modules.yaml]
        pass_filenames: false

  - repo: local
    hooks:
      - id: check-module-registration
        name: check module registration
        entry: uv run robotsix-modules check-registration docs/modules.yaml
        language: system
        pass_filenames: false
        always_run: true
