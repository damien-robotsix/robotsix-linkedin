[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-linkedin"
version = "0.1.0"
description = "LinkedIn API service for fleet agents — OAuth 2.0 auth, profile reads, operator-gated writes."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "robotsix-config>=0.1,<1",
    "robotsix-http>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "0f2e484b59eb306b54ba25fc8bddb5a3e3ad2535" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http", rev = "d216db8d11472045509ea5312b498053f5562d06" }

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_service"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
