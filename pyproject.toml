[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-linkedin"
version = "0.1.0"
description = "LinkedIn API service for fleet agents — OAuth 2.0 auth, profile reads, operator-gated writes."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "robotsix-config>=0.1,<1",
    "robotsix-http[fastapi]>=0.4,<1",
    "robotsix-llmio>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.uv]
# robotsix-llmio transitively pins robotsix-http at an older rev
# (4bf6c1e3…, v0.6.0) that predates the robotsix_http.oauth extraction.
# linkedin_service.auth now consumes robotsix_http.oauth.SecureTokenStore,
# which only exists from 952d984b onward. The bump is additive over v0.6.0
# (new oauth.py; the client / retry API robotsix-llmio consumes is
# unchanged), so overriding the pin graph-wide is safe. Drop this override
# once robotsix-llmio bumps its own robotsix-http pin in lockstep.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http@952d984b1d228efcc880bca9f7d6b00e14eb3eed",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "24dfa8b751fd8505f16f656ad9c3ee1a765ba5b4" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http", rev = "952d984b1d228efcc880bca9f7d6b00e14eb3eed" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio", rev = "e31d639b9a392c70516a74d81efbaf5b02e1b04b" }

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_service"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
