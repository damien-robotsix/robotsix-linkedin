[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-linkedin"
version = "0.1.0"
description = "LinkedIn API service for fleet agents — OAuth 2.0 auth, profile reads, operator-gated writes."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "robotsix-config>=0.1,<1",
    "robotsix-http[fastapi]>=0.4,<1",
    "robotsix-llmio>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

# uv-only dev tooling (PEP 735). Kept out of the `dev` extra because
# robotsix-modules is a git-only dependency that the pip-based
# lint-and-test job cannot resolve; the `modules` CI job installs it via
# `uv run --frozen`.
[dependency-groups]
dev = [
    "robotsix-modules",
]

[tool.uv]
# robotsix-llmio transitively pins robotsix-http at an older rev
# (4bf6c1e3…, v0.6.0) that predates the robotsix_http.oauth extraction.
# linkedin_service.auth now consumes robotsix_http.oauth.SecureTokenStore,
# which only exists from 952d984b onward. The bump is additive over v0.6.0
# (new oauth.py; the client / retry API robotsix-llmio consumes is
# unchanged), so overriding the pin graph-wide is safe. Drop this override
# once robotsix-llmio bumps its own robotsix-http pin in lockstep.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http@726254c4e24e56b409dd9f954b097eebf1c1c0a0",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "82826f8f56f29629fa2c1dc691245349e8de1e54" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http", rev = "726254c4e24e56b409dd9f954b097eebf1c1c0a0" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio", rev = "c47468306f8d1a4cf3094f8fa6bd526c2a500eed" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules", rev = "1c7d01f4ed264524857838fad78b5a3d05d3d774" }  # v0.5.3

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_service"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
