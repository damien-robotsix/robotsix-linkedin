[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotsix-linkedin"
version = "0.2.1"
description = "LinkedIn API service for fleet agents — OAuth 2.0 auth, profile reads, operator-gated writes."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "robotsix-config>=0.1,<1",
    "robotsix-http[fastapi]>=0.4,<1",
    "robotsix-llmio>=0.7,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

# uv-only dev tooling (PEP 735). Kept out of the `dev` extra because
# robotsix-modules is only needed by the `modules` CI job, which installs it
# via `uv run --frozen`.
[dependency-groups]
dev = [
    "robotsix-modules",
]

[tool.uv]
# robotsix-llmio transitively pins robotsix-http at an older rev
# (4bf6c1e3…, v0.6.0) that predates the robotsix_http.oauth extraction.
# linkedin_service.auth now consumes robotsix_http.oauth.SecureTokenStore,
# which only exists from 952d984b onward. The bump is additive over v0.6.0
# (new oauth.py; the client / retry API robotsix-llmio consumes is
# unchanged), so overriding the pin graph-wide is safe. Drop this override
# once robotsix-llmio bumps its own robotsix-http pin in lockstep.
override-dependencies = [
    "robotsix-http @ git+https://github.com/damien-robotsix/robotsix-http@eb3d00244236bc187ea0cc842b1649d8e26adad9",
]

[tool.uv.sources]
robotsix-config = { git = "https://github.com/damien-robotsix/robotsix-config", rev = "5fc9c65449ac7f6dbba3a55f53917339e6230be5" }
robotsix-http = { git = "https://github.com/damien-robotsix/robotsix-http", rev = "eb3d00244236bc187ea0cc842b1649d8e26adad9" }
robotsix-llmio = { git = "https://github.com/damien-robotsix/robotsix-llmio", rev = "2d19f2bc2e2db9d2fa5726e3977974d382e6e3ce" }
robotsix-modules = { git = "https://github.com/damien-robotsix/robotsix-modules", rev = "0c992979ac91c250df2662ed8725a8a4325af7c6" }  # v0.5.3

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_service"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.deptry]
# The `dev` extra holds test/lint tooling (pytest, ruff, mypy, …) that is
# never imported from src/; tell deptry it is a dev group so the shared
# python-ci.yml deptry step does not flag it as unused (DEP002).
pep621_dev_dependency_groups = ["dev"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
